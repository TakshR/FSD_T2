<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .container{
            margin-top: 50px;
            height: 800px;
            border: 1px solid red;
            position: relative;
        }
        .container1{
            margin-top: 30px;
            height: 1000px;
            border: 2px solid black
        }
        .test{
            margin-left: 20px;
            height: 100px;
            width: 100px;
            text-align: center;
            font-size: 30px;
        }
        #test1{
            background-color: aqua;
        }
        #test2{
            background-color: red;
            position: relative;
            top: 50px;
            left: 40px;
            z-index: 1;
        }
        #test3{
            background-color: yellow;
            position: absolute;
            top: 100px;
            right: 0px;
        }
        #test4{
            background-color: green;
            position: fixed;
            top: 50px;
            right: 0;
        }
        #test5{
            background-color: pink;
            position: sticky;
            top: 0px;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="test" id="test1">1</div>
        <div class="test" id="test2">2</div>
        <div class="test" id="test3">3</div>
        <div class="test" id="test4">4</div>
        <div class="test" id="test5">5</div>
    </div>
    <div class="container1"></div>
</body>
</html>
