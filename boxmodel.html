<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

          div{
             height:200px;
             width:200px;
             background-color:rgb(146, 156, 240);
             border-style: groove inset outset ridge;
             border-width: 25px;
             border-color:orange ;
             padding: 70px;
             margin: 30px;
             box-sizing: border-box;
             box-shadow: 10px 10px 10px gold;
        }
        
    </style>
</head>
<body>
    <div> Hello </div>
    
</body>
</html>
<!--
1.border-style: solid / dotted / dashed / double / none / (3d border -> groove / inset / outset)
    Ex: border-style: solid(top,right,botam,left)
        border-style: solid dashed
                      dotted double  (clock wise -> T ,R ,B, L)
2.border-widht: length
3.border-color: name / hex / rgbl
4.border: 5px solid green (width style color)
5.border-top: 5px solid black
6.box-sizing: border-box|content-box
7.box-shadow: h-offset v-offset blur color
8.border-radius: 50% ;
