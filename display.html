

<!--
 DISPLAY:-
 display: inline / block / inline-block / none / flex / gride
flex-direction: row / row-reverse / column / column-reverse
flex-wrap:nowrap / wrap / wrap-reverse
gap:(length)

FLEX :-
justify-content: center / flex-start / flex-end / space-between / space-evenly / space-around
align-item: stretch / center / flex-start / flex-end
order:(number) 

GRID:-
grid-template-columns: length length length.....;
grid-template-rows: auto auto;  


-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        #b1{
            order:1
        }
        #b5{
            order:2
        }
        #b10{
            order:-1
        }
        .s{
            height: 200px;
            width: 200px;
            margin: 20px;
            padding: 20px;
            border: 2px solid red;
             display: inline-block;
           }
        .d{
            height: 200px;
            width: 200px;
            margin: 20px;
            padding: 20px;
            border: 2px solid green;
            /* display: inline; */
        }

        #a:hover{
            display:none;            
        }
        .container{
            width: 600px;
            height: 600px;
            border: 2px solid blue;
            display: inline-flex;
            justify-content: center;
            align-items: center; /*varticaly work*/
            flex-direction: row;
            flex-wrap: wrap;
            gap: 20px;
        }
        .box{
            height: 100px;
            width: 100px;
            border: 2px solid red;
        }

        .gc{
            height:600px;
            width: 600px;
            border: 2px solid blue;
            display: grid;
            /* grid-template-columns: auto auto auto; */
            grid-template-columns: auto auto auto; /* in px or 1fr 1fr 2fr*/
            grid-template-rows: auto auto;  
            

    }
    .gbox{
        background-color: aliceblue;
        border: 2px solid purple;
    }

    #g1{
        grid-column: 1/3;
        grid-row: 1/3;
    }

    .gc1{
            height: 600px;
            width: 600px;
            border:2px solid blueviolet;
            display: grid;
            grid-template-columns: auto auto auto;
            grid-row: auto auto auto auto;
    }
    .gbox1{
        background-color: aliceblue;
        border: 2px solid purple;
    }

    
    #g2{
        grid-column: 1/4;
    
    }
    #g3{
        grid-row: 2/4;
    
    }
    </style>
</head>
<body>
    
    <span class="s">hello</span>
    <span class="s">hello</span>
    <div class="d" id="a">hello</div>
    <div class="d">hello</div>

    <div class="container">
        <div class="box" id="b1">box-1</div>
        <div class="box">box-2</div>
        <div class="box">box-3</div>
        <div class="box">box-4</div>
        <div class="box" id="b5">box-5</div>
        <div class="box">box-6</div>
        <div class="box">box-7</div>
        <div class="box">box-8</div>
        <div class="box">box-9</div>
        <div class="box" id="b10">box-10</div>
    </div>

    <div class="gc">
        <div class="gbox" id="g1">box-1</div>
        <div class="gbox">box-2</div>
        <div class="gbox">box-3</div>
        <div class="gbox">box-4</div>
        <div class="gbox">box-5</div>
        <div class="gbox">box-6</div>
    </div>
    <br>

     <div class="gc1" align="center">
        <div class="gbox1" id="g2">box-1</div>
        <div class="gbox1" id="g3">box-2</div>
        <div class="gbox1">box-3</div>
        <div class="gbox1">box-4</div>
        <div class="gbox1">box-5</div>
        <div class="gbox1">box-6</div>
        <div class="gbox1" id="g2" >box-7</div>
       
    </div>


</body>
</html>
